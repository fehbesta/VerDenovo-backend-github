spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# IMPORTANTE: não defina spring.jpa.hibernate.naming.physical-strategy.
# O padrão do Spring Boot (SpringPhysicalNamingStrategy) converte campos
# camelCase das entidades (ex: nivelAcesso) para snake_case no banco
# (ex: nivel_acesso). Os scripts database.sql/migration.sql assumem essa
# convenção. Se isso for alterado, os nomes de coluna deixam de bater com
# o que os scripts SQL criam.

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=18000000

admin.email=${ADMIN_EMAIL}
admin.senha=${ADMIN_SENHA}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:}
